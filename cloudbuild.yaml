# ============================================================
# Google Cloud Build CI/CD
# GitHub -> Cloud Build -> Artifact Registry -> Cloud Run
# ============================================================

steps:

  # ==========================================================
  # STEP 1: TEST
  # ==========================================================
  - name: 'python:3.10-slim'
    id: 'run-tests'
    entrypoint: 'bash'
    secretEnv:
      - 'GROQ_API_KEY'

    args:
      - '-c'
      - |
        set -e

        echo "======================================"
        echo "Installing dependencies"
        echo "======================================"

        python -m pip install --upgrade pip

        pip install flake8 pytest

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

        echo "======================================"
        echo "Running Flake8"
        echo "======================================"

        flake8 . \
          --count \
          --select=E9,F63,F7,F82 \
          --show-source \
          --statistics

        echo "======================================"
        echo "Running Pytest"
        echo "======================================"

        if [ -d tests ]; then
          pytest tests/
        else
          echo "No tests directory found."
        fi

        echo "======================================"
        echo "Tests completed successfully"
        echo "======================================"


  # ==========================================================
  # STEP 2: BUILD DOCKER IMAGE
  # ==========================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'

    args:
      - 'build'

      # Image with Cloud Build BUILD_ID
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$BUILD_ID'

      # latest tag
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:latest'

      # Dockerfile location
      - '-f'
      - 'Dockerfile'

      # Build context
      - '.'


  # ==========================================================
  # STEP 3: PUSH DOCKER IMAGE
  # ==========================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'

    args:
      - 'push'
      - '--all-tags'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}'


  # ==========================================================
  # STEP 4: DEPLOY TO CLOUD RUN
  # ==========================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'

    entrypoint: 'gcloud'

    args:

      - 'run'
      - 'deploy'

      # Cloud Run service name
      - '${_SERVICE_NAME}'

      # Docker image
      - '--image'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$BUILD_ID'

      # Region
      - '--region'
      - '${_LOCATION}'

      # Managed Cloud Run
      - '--platform'
      - 'managed'

      # Public access
      - '--allow-unauthenticated'

      # Container port
      - '--port'
      - '8080'

      # CPU
      - '--cpu'
      - '2'

      # Memory
      - '--memory'
      - '2Gi'

      # Scale to zero when not used
      - '--min-instances'
      - '0'

      # Keep maximum instances low
      - '--max-instances'
      - '1'

      # Application environment variable
      - '--set-env-vars'
      - 'STREAMLIT_BROWSER_GATHER_USAGE_STATS=false'

      # Secret Manager
      - '--set-secrets'
      - 'GROQ_API_KEY=GROQ_API_KEY:latest'


# ============================================================
# ARTIFACT REGISTRY IMAGES
# ============================================================

images:

  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$BUILD_ID'

  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:latest'


# ============================================================
# SUBSTITUTION VARIABLES
# ============================================================

substitutions:

  _LOCATION: 'asia-south1'

  _REPO_NAME: 'rag'

  _IMAGE_NAME: 'rag-app'

  _SERVICE_NAME: 'rag-app'


# ============================================================
# SECRET MANAGER
# ============================================================

availableSecrets:

  secretManager:

    - versionName: 'projects/$PROJECT_ID/secrets/GROQ_API_KEY/versions/latest'
      env: 'GROQ_API_KEY'


# ============================================================
# BUILD OPTIONS
# ============================================================

options:

  logging: 'CLOUD_LOGGING_ONLY'