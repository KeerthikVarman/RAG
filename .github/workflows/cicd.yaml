name: CI/CD Pipeline - PDF RAG System

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:

  # ============================================================
  # 1. CONTINUOUS INTEGRATION
  # ============================================================
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest
        env:
          GROQ_API_KEY: "gsk_dummy_key_for_testing"
        run: |
          pytest tests/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: keerthikvarmaa123/demo2:${{ github.sha }}


  # ============================================================
  # 2. CONTINUOUS DEPLOYMENT - DOCKER HUB
  # ============================================================
  cd:
    name: Build and Push Docker Image
    needs: ci

    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: keerthikvarmaa123/demo2
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  # ============================================================
  # 3. DEPLOY TO GOOGLE CLOUD VM
  # ============================================================
  deploy:
    name: Deploy to Google Cloud VM
    needs: cd

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Google Cloud VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            echo "Connected to Google Cloud VM"

            echo "Checking Docker..."
            docker --version

            echo "Pulling latest Docker image..."
            docker pull keerthikvarmaa123/demo2:latest

            echo "Stopping existing container..."
            docker stop rag-app || true

            echo "Removing existing container..."
            docker rm rag-app || true

            echo "Starting new container..."
            docker run -d \
              --name rag-app \
              -p 8000:8000 \
              -p 8501:8501 \
              -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
              -e STREAMLIT_BROWSER_GATHER_USAGE_STATS="false" \
              --restart unless-stopped \
              keerthikvarmaa123/demo2:latest

            echo "Deployment completed successfully"

            echo "Running containers:"
            docker ps

            echo "Recent application logs:"
            docker logs --tail 50 rag-app